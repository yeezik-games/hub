<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- sfondo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14123a"/>
      <stop offset=".55" stop-color="#0b0a24"/>
      <stop offset="1" stop-color="#06192a"/>
    </linearGradient>
    <radialGradient id="bgGlowA" cx=".85" cy=".1" r=".6">
      <stop offset="0" stop-color="#5b3bd6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b3bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx=".1" cy=".95" r=".55">
      <stop offset="0" stop-color="#1fa6b8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1fa6b8" stop-opacity="0"/>
    </radialGradient>
    <!-- pianeta -->
    <radialGradient id="planet" cx=".33" cy=".28" r=".85">
      <stop offset="0" stop-color="#8f7dff"/>
      <stop offset=".45" stop-color="#5a3fe0"/>
      <stop offset="1" stop-color="#1d1470"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx=".5" cy=".5" r=".5">
      <stop offset=".6" stop-color="#6a4cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6a4cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="250" cy="248" r="118"/></clipPath>
    <!-- Y: facciata, fianchi, bordo luce -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e6eeff"/>
      <stop offset="1" stop-color="#9fd2ff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7ff0"/>
      <stop offset=".6" stop-color="#3b3aa8"/>
      <stop offset="1" stop-color="#1c1660"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- anello -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b47cff"/>
      <stop offset=".5" stop-color="#9fb4ff"/>
      <stop offset="1" stop-color="#8fe3ff"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8ff"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="6" dy="14" stdDeviation="10" flood-color="#05031a" flood-opacity=".75"/></filter>

    <!-- forma della Y -->
    <path id="Y" d="M146 146 H228 L256 200 L284 146 H366 L294 268 V374 H218 V268 Z"/>
    <!-- metà anteriore e posteriore dell'anello -->
    <path id="ringBack"  d="M84 318 A178 44 -14 0 1 432 232"/>
    <path id="ringFront" d="M432 232 A178 44 -14 0 1 84 318"/>
  </defs>

  <!-- tessera -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlowA)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlowB)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#8fa8ff" stroke-opacity=".18" stroke-width="3"/>

  <!-- stelle filanti -->
  <g stroke="#a9a2ff" stroke-linecap="round" stroke-width="3" opacity=".7">
    <path d="M150 62 l14 -14"/><path d="M400 92 l12 -12"/><path d="M456 158 l18 -18" opacity=".8"/>
    <path d="M62 236 l18 -18"/><path d="M78 160 l8 -8" opacity=".6"/><path d="M430 384 l16 -16"/>
    <path d="M118 444 l16 -16"/><path d="M362 452 l12 -12" opacity=".7"/><path d="M466 300 l6 -6" opacity=".6"/>
  </g>

  <!-- pianeta -->
  <circle cx="250" cy="248" r="150" fill="url(#planetGlow)"/>
  <circle cx="250" cy="248" r="118" fill="url(#planet)"/>
  <g clip-path="url(#planetClip)" opacity=".55">
    <path d="M110 176 Q250 150 390 182" stroke="#b9adff" stroke-width="7" fill="none" opacity=".55"/>
    <path d="M110 206 Q250 184 390 212" stroke="#2a1d8f" stroke-width="10" fill="none" opacity=".5"/>
    <path d="M110 238 Q250 220 390 246" stroke="#a99cff" stroke-width="5" fill="none" opacity=".45"/>
    <path d="M110 296 Q250 282 390 304" stroke="#21177a" stroke-width="12" fill="none" opacity=".45"/>
    <circle cx="300" cy="320" r="120" fill="#0a0640" opacity=".55" filter="url(#soft)"/>
  </g>

  <!-- anello dietro -->
  <use href="#ringBack" stroke="url(#ring)" stroke-width="9" fill="none" stroke-linecap="round" opacity=".55"/>

  <!-- Y in 3D: ombra, estrusione, facciata, smusso -->
  <g filter="url(#shadow)">
    <g fill="url(#side)">
      <use href="#Y" transform="translate(22 26)"/>
      <use href="#Y" transform="translate(20 23.6)"/>
      <use href="#Y" transform="translate(18 21.3)"/>
      <use href="#Y" transform="translate(16 18.9)"/>
      <use href="#Y" transform="translate(14 16.5)"/>
      <use href="#Y" transform="translate(12 14.2)"/>
      <use href="#Y" transform="translate(10 11.8)"/>
      <use href="#Y" transform="translate(8 9.5)"/>
      <use href="#Y" transform="translate(6 7.1)"/>
      <use href="#Y" transform="translate(4 4.7)"/>
      <use href="#Y" transform="translate(2 2.4)"/>
    </g>
    <!-- spigoli dell'estrusione -->
    <g stroke="#9aa6ff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
      <path d="M366 146 l22 26"/><path d="M294 374 l22 26"/><path d="M294 268 l22 26"/><path d="M256 200 l22 26"/>
    </g>
  </g>
  <use href="#Y" fill="url(#face)"/>
  <use href="#Y" fill="none" stroke="url(#bevel)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M152 150 H224 L238 177" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"/>

  <!-- anello davanti + luna -->
  <use href="#ringFront" stroke="url(#ring)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="414" cy="242" r="24" fill="#c9d4ff" opacity=".35" filter="url(#soft)"/>
  <circle cx="414" cy="242" r="15" fill="url(#moon)"/>
</svg>
