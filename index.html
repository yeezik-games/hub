<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yeezik Games Hub</title>
  <meta name="description" content="Tutti i giochi di Yeezik in un unico posto: Intesa Vincente, Tappabuchi, Sintonia.">
  <meta name="theme-color" content="#03040b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --void: #03040b;
      --ice: #bfe6ff;
      --text: #f4f6ff;
      --muted: #b9c6e6;
      --faint: #7d8bb0;
      --f-display: "Syncopate", "Arial Black", system-ui, sans-serif;
      --f-body: "Manrope", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--void); }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: var(--f-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* ---------- Sfondo ---------- */
    .bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse at 70% 20%, #1b1440, transparent 55%),
        radial-gradient(ellipse at 15% 80%, #0d2a3d, transparent 50%),
        var(--void);
    }
    .bg canvas { width: 100%; height: 100%; display: block; }

    .wrap {
      max-width: 1100px; margin: 0 auto;
      padding-top: max(64px, calc(env(safe-area-inset-top) + 40px));
      padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px));
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }

    /* ---------- Testata ---------- */
    header { display: grid; gap: 18px; justify-items: center; text-align: center; margin-bottom: 44px; }
    .coord { font-family: var(--f-display); font-size: 10px; letter-spacing: .32em; color: var(--ice); opacity: .8; }
    h1 {
      font-family: var(--f-display); font-weight: 700;
      font-size: clamp(30px, 7.4vw, 84px); line-height: 1; letter-spacing: .02em;
      text-transform: uppercase; text-wrap: balance;
      background: linear-gradient(180deg, #fff 30%, #8fbfff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 30px rgba(120, 170, 255, .45));
    }
    .sub { color: var(--muted); max-width: 42ch; line-height: 1.55; font-size: 16px; }
    .share-btn {
      display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
      font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: var(--void); background: var(--ice); border: 0; border-radius: 999px; padding: 13px 22px;
      box-shadow: 0 0 30px -4px rgba(191, 230, 255, .6);
      transition: transform .2s, box-shadow .2s;
    }
    .share-btn:hover { transform: translateY(-2px); box-shadow: 0 0 44px 0 rgba(191, 230, 255, .75); }
    .share-btn svg { width: 16px; height: 16px; }

    /* ---------- Pianeti ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
    .planet {
      display: grid; justify-items: center; align-content: start; gap: 14px; text-align: center;
      padding: 24px 12px 30px; border-radius: 26px; transition: background .3s;
    }
    .planet:hover, .planet:focus-visible { background: rgba(255, 255, 255, .04); outline: none; }
    .planet:focus-visible { box-shadow: 0 0 0 2px var(--ice); }
    .orbit { position: relative; width: 200px; height: 200px; display: grid; place-items: center; animation: hover 6s ease-in-out infinite; animation-delay: var(--d); }
    @keyframes hover { 50% { transform: translateY(-12px); } }
    .sphere {
      position: relative; z-index: 1; width: 132px; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .55), transparent 35%),
        radial-gradient(circle at 70% 75%, rgba(0, 0, 0, .65), transparent 60%),
        var(--c);
      box-shadow: 0 0 50px -6px var(--c), inset -14px -16px 40px rgba(0, 0, 0, .55);
      transition: transform .4s;
    }
    .sphere::before {
      content: ""; position: absolute; inset: 0; mix-blend-mode: overlay;
      background: repeating-linear-gradient(170deg, transparent 0 12px, rgba(255,255,255,.14) 12px 18px, transparent 18px 30px, rgba(0,0,0,.12) 30px 40px);
      background-size: 200% 100%; animation: surface 9s linear infinite;
    }
    @keyframes surface { to { background-position: -200% 0; } }
    .planet:hover .sphere { transform: scale(1.08); }
    .ring { position: absolute; width: 200px; height: 56px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--c) 70%, #fff); transform: rotate(-18deg); opacity: .75; }
    .ring.back { clip-path: inset(0 0 50% 0); z-index: 0; }
    .ring.front { clip-path: inset(50% 0 0 0); z-index: 2; }
    .moon { position: absolute; z-index: 3; width: 14px; height: 14px; border-radius: 50%; background: #dfe7ff; box-shadow: 0 0 12px #9cc4ff; offset-path: ellipse(96px 30px at 50% 50%); animation: moon 5s linear infinite; }
    @supports not (offset-path: ellipse(1px 1px)) { .moon { display: none; } }
    @keyframes moon { to { offset-distance: 100%; } }
    .planet h2 { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
    .planet p { color: var(--muted); line-height: 1.55; max-width: 30ch; }
    .go { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; padding: 11px 20px; border: 1px solid rgba(191, 230, 255, .4); border-radius: 999px; color: var(--ice); transition: background .25s, color .25s; }
    .planet:hover .go, .planet:focus-visible .go { background: var(--ice); color: var(--void); }

    /* Pianeta "in arrivo" */
    .planet.soon { cursor: default; }
    .planet.soon:hover { background: none; }
    .planet.soon .sphere { background: transparent; box-shadow: none; overflow: visible; }
    .planet.soon .sphere::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(191, 230, 255, .35); animation: spin 40s linear infinite; }
    .planet.soon .sphere::before { display: none; }
    .planet.soon .plus { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 300; color: var(--faint); }
    .planet.soon h2 { color: var(--faint); font-size: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Icone animate */
    .ico { position: absolute; inset: 0; margin: auto; width: 44px; height: 44px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; overflow: visible; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .ico .hand { transform-origin: 12px 13px; animation: spin 3s steps(12) infinite; }
    .ico .dot { animation: typing 1.2s ease-in-out infinite; }
    .ico .dot:nth-child(3) { animation-delay: .15s; } .ico .dot:nth-child(4) { animation-delay: .3s; }
    .ico .needle { transform-origin: 12px 17px; animation: swing 2.6s ease-in-out infinite; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-2px); } }
    @keyframes swing { 0%, 100% { transform: rotate(-55deg); } 50% { transform: rotate(55deg); } }

    footer { margin-top: 40px; text-align: center; font-family: var(--f-display); font-size: 10px; letter-spacing: .24em; color: var(--faint); }

    /* ---------- Intro ---------- */
    .intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: pointer; }
    .hud { font-family: var(--f-display); text-align: center; color: var(--ice); letter-spacing: .3em; font-size: 11px; opacity: 0; padding: 0 16px; }
    .hud b { display: block; font-size: clamp(26px, 7vw, 64px); letter-spacing: .04em; color: #fff; margin-top: 12px; }
    .skip { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
    body.run .hud { animation: hudIn 1s ease-out 1.9s forwards; }
    @keyframes hudIn { 0% { opacity: 0; transform: scale(.6); filter: blur(10px); } 100% { opacity: 1; transform: none; filter: none; } }
    body.run .intro { animation: fadeOut .6s ease 3.2s forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    body.run main { animation: arrive 1s cubic-bezier(.2, .8, .2, 1) 3.3s both; }
    @keyframes arrive { from { opacity: 0; transform: scale(.92); } }
    body.done .intro { display: none; }

    /* ---------- Condividi ---------- */
    .overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 18px; background: rgba(3, 4, 11, .7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
    .overlay.open { opacity: 1; visibility: visible; }
    .sheet { position: relative; width: min(100%, 380px); display: grid; gap: 16px; justify-items: center; text-align: center; padding: 30px 24px 24px; border-radius: 28px; background: linear-gradient(180deg, #141a33, #0a0d1c); border: 1px solid rgba(191, 230, 255, .18); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 60px -20px rgba(120, 170, 255, .5); transform: translateY(16px) scale(.97); transition: transform .3s cubic-bezier(.2, .9, .3, 1.2); }
    .overlay.open .sheet { transform: none; }
    .sheet h3 { font-family: var(--f-display); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
    .hint { color: var(--muted); font-size: 14px; }
    .close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255, 255, 255, .08); color: var(--text); }
    #qrcode { background: #fff; padding: 14px; border-radius: 18px; }
    #qrcode img, #qrcode canvas { display: block; width: 210px !important; height: 210px !important; }
    .copy-row { display: flex; gap: 8px; width: 100%; }
    .copy-row input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(191, 230, 255, .2); background: rgba(255, 255, 255, .05); color: var(--text); font: 13px var(--f-body); }
    .copy-row button { padding: 0 16px; border-radius: 14px; border: 0; cursor: pointer; background: var(--ice); color: var(--void); font-weight: 700; font-size: 13px; }
    .native-share { width: 100%; padding: 12px; border-radius: 14px; cursor: pointer; background: transparent; color: var(--ice); border: 1px solid rgba(191, 230, 255, .3); font-weight: 600; }
    .native-share[hidden] { display: none; }

    :focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition: none !important; }
      .intro { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><canvas id="stars"></canvas></div>

  <div class="intro" id="intro" title="Tocca per saltare">
    <div class="hud">Destinazione raggiunta<b>Yeezik System</b></div>
    <span class="skip">Tocca per saltare</span>
  </div>

  <main class="wrap">
    <header>
      <span class="coord" id="coord">SISTEMA YZK · PIANETI ABITATI</span>
      <h1>Yeezik Games Hub</h1>
      <p class="sub">Ogni pianeta è un gioco. Scegline uno e porta i tuoi amici in orbita.</p>
      <button class="share-btn" id="openShare" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        Condividi
      </button>
    </header>

    <div class="grid" id="grid"></div>

    <footer>© <span id="year"></span> YEEZIK · FINE TRASMISSIONE</footer>
  </main>

  <div class="overlay" id="shareOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <button class="close" id="closeShare" type="button" aria-label="Chiudi">✕</button>
      <h3 id="shareTitle">Invita gli amici</h3>
      <p class="hint">Inquadra il codice o copia il link.</p>
      <div id="qrcode"></div>
      <div class="copy-row">
        <input id="shareLink" type="text" readonly aria-label="Link del sito">
        <button id="copyBtn" type="button">Copia</button>
      </div>
      <button class="native-share" id="nativeShare" type="button" hidden>Condividi con un'app…</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    /* =====================================================
       ELENCO GIOCHI
       Per aggiungere un gioco copia un blocco { ... },
       incollalo in fondo alla lista e cambia i campi:
         nome        → nome del pianeta
         descrizione → testo breve sotto il nome
         icona       → una tra: "timer", "chat", "quadrante",
                       "dado", "carte", "trofeo", "microfono"
         link        → indirizzo del gioco
         colore      → colore del pianeta (formato #RRGGBB)
       ===================================================== */
    const GIOCHI = [
      {
        nome: "Intesa Vincente",
        descrizione: "Indovina la parola dalle definizioni dei compagni di squadra, contro il tempo.",
        icona: "timer",
        link: "https://yeezikdev.github.io/intesa-vincente",
        colore: "#ff5a3d"
      },
      {
        nome: "Tappabuchi",
        descrizione: "Riempi i buchi con la risposta più divertente. Gli altri votano la migliore.",
        icona: "chat",
        link: "https://yeezikdev.github.io/quiplash",
        colore: "#7a5cff"
      },
      {
        nome: "Sintonia",
        descrizione: "Dai un indizio su una scala tra due estremi: gli amici devono indovinare dove stai.",
        icona: "quadrante",
        link: "https://yeezikdev.github.io/sintonia",
        colore: "#1fc8a8"
      },
    ];

    // Mostra il pianeta "Nuovi giochi in arrivo" in fondo (true / false)
    const MOSTRA_PROSSIMAMENTE = true;

    // Link che viene condiviso (cambialo qui se sposti la pagina)
    const LINK_CONDIVISIONE = "https://yeezikdev.github.io/yeezik-gameshub";

    /* ---------- Da qui in giù non serve modificare ---------- */
    const ICONE = {
      timer: '<circle cx="12" cy="13" r="8"/><path d="M9.5 2h5M12 2v3"/><path class="hand" d="M12 13V8.5"/>',
      chat: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/><circle class="dot" cx="8" cy="11.5" r=".9" fill="#fff"/><circle class="dot" cx="12" cy="11.5" r=".9" fill="#fff"/><circle class="dot" cx="16" cy="11.5" r=".9" fill="#fff"/>',
      quadrante: '<path d="M3 17a9 9 0 0 1 18 0"/><path d="M5.5 12.5l1 .6M12 8v1.2M18.5 12.5l-1 .6"/><path class="needle" d="M12 17V10"/><circle cx="12" cy="17" r="1.3" fill="#fff"/>',
      dado: '<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="#fff"/><circle cx="15.5" cy="15.5" r="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.1" fill="#fff"/>',
      carte: '<rect x="2" y="6" width="12" height="16" rx="2" transform="rotate(-8 8 14)"/><rect x="10" y="3" width="12" height="16" rx="2" transform="rotate(8 16 11)"/>',
      trofeo: '<path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
      microfono: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/>'
    };

    const grid = document.getElementById("grid");
    GIOCHI.forEach((g, i) => {
      const a = document.createElement("a");
      a.className = "planet";
      a.href = g.link;
      a.style.setProperty("--c", g.colore || "#7a5cff");
      a.style.setProperty("--d", (-i * 2) + "s");
      a.innerHTML = `
        <div class="orbit">
          <div class="ring back"></div>
          <div class="sphere"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONE[g.icona] || ICONE.dado}</svg></div>
          <div class="ring front"></div>
          <div class="moon" style="animation-delay:${-i * 1.7}s"></div>
        </div>
        <h2></h2><p></p><span class="go">Atterra</span>`;
      a.querySelector("h2").textContent = g.nome;
      a.querySelector("p").textContent = g.descrizione || "";
      grid.appendChild(a);
    });
    if (MOSTRA_PROSSIMAMENTE) {
      const s = document.createElement("div");
      s.className = "planet soon";
      s.innerHTML = `<div class="orbit"><div class="sphere"><span class="plus">+</span></div></div><h2>Nuovi pianeti in arrivo</h2>`;
      grid.appendChild(s);
    }
    document.getElementById("coord").textContent = `SISTEMA YZK · ${GIOCHI.length} PIANETI ABITATI`;
    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- Stelle + salto nell'iperspazio ---------- */
    const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
    let W, H, warpStart = 0;
    const stars = Array.from({ length: 420 }, () => ({ x: (Math.random() - .5) * 2, y: (Math.random() - .5) * 2, z: Math.random() }));
    function size() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    addEventListener("resize", size); size();
    function frame(now) {
      const t = (now - warpStart) / 1000;
      const speed = warpStart
        ? (t < .3 ? .002 : t < 1.9 ? .002 + Math.pow(Math.min((t - .3) / 1, 1), 2) * .05 : Math.max(.0012, .052 * Math.exp(-(t - 1.9) * 3)))
        : .0012;
      const streak = Math.min(speed * 14, .7);
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2, f = Math.max(W, H) * .5;
      for (const s of stars) {
        const pz = s.z; s.z -= speed;
        if (s.z <= .02) { s.z = 1; s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; continue; }
        const sx = cx + s.x / s.z * f, sy = cy + s.y / s.z * f;
        const tz = Math.min(pz + streak, 1), tx = cx + s.x / tz * f, ty = cy + s.y / tz * f;
        ctx.strokeStyle = `rgba(${200 + 55 * (1 - s.z) | 0},220,255,${Math.min(1, (1 - s.z) * 1.4)})`;
        ctx.lineWidth = Math.max(.6, (1 - s.z) * 2.4);
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(sx + .1, sy + .1); ctx.stroke();
      }
      requestAnimationFrame(frame);
    }

    /* ---------- Intro (una volta per visita) ---------- */
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let giaVista = false;
    try { giaVista = sessionStorage.getItem("introVista") === "1"; } catch (e) {}
    if (giaVista || reduce) {
      document.body.classList.add("done");
    } else {
      document.body.classList.add("run");
      warpStart = performance.now();
      try { sessionStorage.setItem("introVista", "1"); } catch (e) {}
    }
    document.getElementById("intro").addEventListener("click", () => {
      document.body.classList.remove("run"); document.body.classList.add("done"); warpStart = 0;
    });
    requestAnimationFrame(frame);

    /* ---------- Condivisione ---------- */
    const overlay = document.getElementById("shareOverlay");
    const linkInput = document.getElementById("shareLink");
    const copyBtn = document.getElementById("copyBtn");
    const nativeBtn = document.getElementById("nativeShare");
    let qrCreato = false;
    linkInput.value = LINK_CONDIVISIONE;

    function apriCondividi() {
      if (!qrCreato && window.QRCode) {
        new QRCode(document.getElementById("qrcode"), { text: LINK_CONDIVISIONE, width: 360, height: 360, colorDark: "#03040b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        qrCreato = true;
      }
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }
    function chiudiCondividi() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }
    document.getElementById("openShare").addEventListener("click", apriCondividi);
    document.getElementById("closeShare").addEventListener("click", chiudiCondividi);
    overlay.addEventListener("click", e => { if (e.target === overlay) chiudiCondividi(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") chiudiCondividi(); });

    copyBtn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(LINK_CONDIVISIONE); }
      catch (e) { linkInput.select(); document.execCommand("copy"); }
      copyBtn.textContent = "Copiato!";
      setTimeout(() => copyBtn.textContent = "Copia", 1800);
    });

    if (navigator.share) {
      nativeBtn.hidden = false;
      nativeBtn.addEventListener("click", () => {
        navigator.share({ title: "Yeezik Games Hub", text: "Giochiamo insieme!", url: LINK_CONDIVISIONE }).catch(() => {});
      });
    }
  </script>
</body>
</html>
